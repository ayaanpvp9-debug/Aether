# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint for VELTRIX — https://render.com/docs/blueprint-spec
#
# One Node.js web service serves the built React site (dist/) and the /api
# routes from the same origin. Create it with: Render Dashboard → New →
# Blueprint → pick this repo and branch. Guide: README.md → "Deploying to Render".
# This file contains no secrets.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: veltrix
    runtime: node
    # Free = $0, but local files (including the SQLite database) are wiped on
    # every redeploy, restart and idle spin-down (after 15 min without traffic).
    # The site labels that storage "temporary". To keep inquiries, see
    # "PERSISTENT SQLITE" below.
    plan: free
    # Closest Render region to India. It cannot be changed after creation.
    region: singapore
    # --include=dev: the build needs Vite and TypeScript even if NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # Same as `npm start`, without an extra npm process between Render and Node.
    startCommand: node dist-server/index.js
    # Returns 200 only when the server is up AND the inquiry store answers a query.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # The Node.js version comes from .node-version (22.x, the tested version).
    envVars:
      # Render's edge always overwrites True-Client-IP with the real visitor IP.
      # (X-Forwarded-For keeps client-supplied values, so it is not trusted.)
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # Random 256-bit value generated by Render; never committed. Enables
      # GET /api/inquiries with "Authorization: Bearer <token>" — the way to read
      # submissions, since free instances have no shell.
      - key: ADMIN_TOKEN
        generateValue: true
      # PERSISTENT SQLITE (1/2): uncomment these two lines together with the disk.
      # - key: DATA_DIR
      #   value: /var/data
    # PERSISTENT SQLITE (2/2): paid only — 0.5c-512mb ($7/mo) + disk ($0.25/GB/mo),
    # prices per render.com/pricing. Steps:
    #   1. change `plan: free` above to `plan: 0.5c-512mb`
    #   2. remove the leading "# " from the two DATA_DIR lines above and the
    #      four disk lines below
    #   3. commit and push — Render applies the change and redeploys
    # disk:
    #   name: veltrix-data
    #   mountPath: /var/data
    #   sizeGB: 1
