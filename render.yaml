# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint for VELTRIX — https://render.com/docs/blueprint-spec
#
# One Node.js web service serves the built React site (dist/) and the tiny
# /api/health endpoint from the same origin. Create it with: Render Dashboard →
# New → Blueprint → pick this repo and branch. Guide: README.md → "Deploying to Render".
# This file contains no secrets.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: veltrix
    runtime: node
    # Free = $0. The site is a showcase and stores nothing, so the free plan's
    # ephemeral filesystem doesn't matter; after 15 min without traffic the
    # instance sleeps and the next visit takes about a minute to wake it.
    plan: free
    # Closest Render region to India. It cannot be changed after creation.
    region: singapore
    # --include=dev: the build needs Vite and TypeScript even if NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # Same as `npm start`, without an extra npm process between Render and Node.
    startCommand: node dist-server/index.js
    # Returns 200 as soon as the server is up.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # The Node.js version comes from .node-version (22.x, the tested version).
    # No environment variables are needed: Render provides PORT and RENDER_EXTERNAL_URL.
